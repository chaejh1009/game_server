<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마을 준비 중</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #2f2f2f;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #dedbd3;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    p {
      margin: 12px 0;
    }

    .room {
      margin: 16px 0;
      padding: 14px;
      background: #f1f4ee;
      border-radius: 8px;
    }

    a {
      color: #4f6b4f;
      font-weight: 700;
    }

    form {
      margin-top: 24px;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #4f6b4f;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #405a40;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>마을 준비 중</h1>

    <p>
      현재 사용자:
      <strong>{{ user.username }}</strong>
    </p>

    <div class="room">
      <p>
        room_id:
        <strong id="room-id">조회 중...</strong>
      </p>
    </div>

    <p>
      <a href="/api/player/" target="_blank" rel="noopener noreferrer">
        내 상태 조회
      </a>
    </p>

    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">로그아웃</button>
    </form>
  </main>

  <script>
    fetch("/api/player/")
      .then(response => response.json())
      .then(player => {
        document.getElementById("room-id").textContent = player.room_id;
      })
      .catch(() => {
        document.getElementById("room-id").textContent = "조회 실패";
      });
  </script>
</body>
</html>
