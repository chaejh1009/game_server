<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작은 마을 입장</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #f5f3ee;
      font-family: Arial, sans-serif;
      color: #2f2f2f;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: #ffffff;
      border: 1px solid #dedbd3;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }

    form p {
      margin: 0 0 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      max-width: 100%;
      padding: 11px 12px;
      border: 1px solid #c9c6bf;
      border-radius: 8px;
      font: inherit;
      background: #ffffff;
    }

    input:focus {
      outline: 2px solid #7d9273;
      outline-offset: 1px;
      border-color: #7d9273;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #4f6b4f;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #405a40;
    }

    .errorlist {
      margin: 0 0 12px;
      padding-left: 20px;
      color: #a33a3a;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        padding-top: 40px;
      }

      .login-card {
        padding: 24px 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>작은 마을 입장</h1>

    <form method="post">
      {% csrf_token %}

      {{ form.as_p }}

      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
